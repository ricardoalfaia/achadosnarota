# Verificação do monorepo em todo push na main e em todo pull request.
# Proteja a main exigindo este workflow (Settings → Branches → Require status checks).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    # O mesmo Postgres do docker-compose, na mesma porta: os padrões de
    # desenvolvimento (scripts/load-env.mjs) já apontam para ele.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: achados
          POSTGRES_PASSWORD: achados
          POSTGRES_DB: achados
        ports: ["4550:5432"]
        options: >-
          --health-cmd "pg_isready -U achados -d achados"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # Service container não roda o init do docker/: o papel da app é criado aqui.
      - name: Banco (papel da app e migrations)
        run: |
          pnpm --filter @achados/db db:setup-app-role
          pnpm db:migrate

      # Isolamento entre tenants (RLS) contra o banco real; aqui não pode pular.
      - name: Testes de isolamento
        run: pnpm --filter @achados/db test:integracao

      # As histórias do design system e o E2E rodam em Chromium.
      - name: Navegador do Playwright
        run: pnpm --filter achados-web exec playwright install --with-deps chromium

      - name: Formatação, arquitetura, ambiente, lint, tipos, testes e build
        run: pnpm check

      - name: E2E
        run: pnpm test:e2e

      - name: Relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/*/playwright-report
          if-no-files-found: ignore
