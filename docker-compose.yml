# Infraestrutura de desenvolvimento do Meuproduto.
#
# Mesmo padrão do scribevox: tudo local, sem custo e sem credencial remota.
# Containers e volumes são só do Meuproduto; nenhum banco é compartilhado com
# outros projetos da máquina (isolamento e mínimo privilégio, docs/produto/04).
#
# Portas na faixa 4400, como o resto do monorepo (README, "Portas"), e só em
# 127.0.0.1: nada fica exposto na rede local.
#   4450  PostgreSQL 18      postgresql://meuproduto:meuproduto@127.0.0.1:4450/meuproduto
#   4451  Storage S3         http://127.0.0.1:4451  (chave meuproduto / meuproduto-dev,
#                            bucket privado meuproduto-documentos)
#
#   pnpm infra:up      sobe os serviços
#   pnpm infra:down    para os serviços (os volumes continuam)
#   pnpm infra:reset   apaga os volumes e recria do zero
#
# Credenciais fixas valem só aqui. Dados reais de clientes nunca entram neste
# ambiente: use fixtures sintéticas (docs/produto/09).

services:
  postgres:
    image: postgres:18-alpine
    container_name: meuproduto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meuproduto
      POSTGRES_PASSWORD: meuproduto
      POSTGRES_DB: meuproduto
      POSTGRES_INITDB_ARGS: "--data-checksums"
    # Acelera o banco de desenvolvimento; nunca use isso em produção.
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    ports:
      - "127.0.0.1:4450:5432"
    volumes:
      # O Postgres 18 quer a montagem em /var/lib/postgresql (o PGDATA vai num
      # subdiretório), para permitir pg_upgrade --link entre versões.
      - meuproduto-pgdata:/var/lib/postgresql
      # Cria o papel da aplicação (meuproduto_app, sujeito a RLS) na primeira
      # subida do volume. Volume já existente: pnpm --filter @meuproduto/db
      # db:setup-app-role, que faz o mesmo e é idempotente.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meuproduto -d meuproduto"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Armazenamento de objetos compatível com S3 para os PDFs (SeaweedFS: a imagem
  # pública do MinIO deixou de ser publicada em 2025). Só a identidade
  # `meuproduto` acessa: não há identidade anônima, então nenhum objeto é público
  # e nada é servido sem URL assinada, como em produção (docs/produto/adr/ADR-005).
  storage:
    image: chrislusf/seaweedfs:4.48
    container_name: meuproduto-storage
    restart: unless-stopped
    command: >
      server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=64 -volume.max=0
    ports:
      - "127.0.0.1:4451:8333"
    volumes:
      - meuproduto-storage:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 24

  # Cria o bucket uma vez e sai.
  storage-bucket:
    image: chrislusf/seaweedfs:4.48
    container_name: meuproduto-storage-bucket
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      sh -c "echo 's3.bucket.create -name meuproduto-documentos' |
             weed shell -master=storage:9333 2>&1 | grep -v 'already exists' || true"
    restart: "no"

volumes:
  meuproduto-pgdata:
  meuproduto-storage:
